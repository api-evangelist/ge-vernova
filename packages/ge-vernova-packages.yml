method: searched
source: >-
  registry.npmjs.org, pypi.org, search.maven.org, azuresearch-usnc.nuget.org, rubygems.org,
  crates.io, and the GE Vernova Electrification Software product documentation
official_sdk_count: 0
note: >-
  GE Vernova publishes no first-party client library for any Electrification Software product on
  any public package registry. Searches for "gevernova", "ge-vernova", "proficy" and the scope
  @gevernova returned nothing on npm, PyPI, Maven Central, NuGet, RubyGems and crates.io; the
  github.com/GE-Vernova organization exists but holds zero public repositories. The integration
  path GE Vernova documents is the raw REST/OData surface plus product-native clients that ship
  inside the installer (the Historian SDK and User API, the Historian and Operations Hub Excel
  add-ins, the OLE DB provider) — none of which is distributed through a registry, so none has a
  version an integrator can pin or a release date anyone can read.
  The one SDK family that IS on a registry belongs to GE Predix, the GE Digital platform that
  preceded the spin-off, published under github.com/PredixDev and to npm by an individual
  maintainer. Cloud APM documentation still references Predix platform services, so the lineage is
  real — but predix.io is gone, the newest of these packages last shipped in 2018, and GE Vernova
  has not re-published them under its own name. They are recorded as unofficial for that reason,
  and they are the strongest decay signal available here: a client library whose last release
  predates the spin-off of the company that would have to maintain it.
