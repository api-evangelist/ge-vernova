apis:
  - aid: ge-vernova-proficy-historian-rest-api
    name: Proficy Historian REST API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ge-vernova.png
    description: >-
      Manage Proficy Historian systems, collectors, collector instances, data stores, tags, the
      Historian model and alarms and events, and query time-series tag samples with a choice of
      sampling, calculation and filter modes. REST constrained by HATEOAS, JSON responses, OAuth2
      bearer tokens issued by Proficy Authentication. Runs on the customer's own Historian
      web-based-client host; a Swagger UI is served from the same installation.
      No machine-readable contract is published by GE Vernova.
    humanURL: https://www.gevernova.com/software/documentation/historian/version2025/c_historian_apis_overview.html
    baseURL: https://{historian-web-client-host}/historian-rest-api/v1
    tags:
      - Historian
      - Time Series
      - Industrial
      - Energy
    properties:
