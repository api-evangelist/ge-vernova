  - aid: ge-vernova-proficy-operations-hub-rest-api
    name: Proficy Operations Hub REST APIs
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ge-vernova.png
    description: >-
      Two REST surfaces on an Operations Hub installation. The integration APIs let a third-party
      server authenticate, pull rows from the M2M_data entity, and read or insert rows in any
      custom entity. The M2M device APIs let sensors and gateways log in, publish telemetry, and
      subscribe for commands over plain REST POST with JSON payloads. Operations Hub also ships an
      MQTT client with a defined topic namespace.
    humanURL: https://www.gevernova.com/software/documentation/opshub/version2025/windows/r_rest_integration_apis.html
    baseURL: https://{operations-hub-site-url}/app/iqp/api/rest
    tags:
      - Industrial
      - IoT
      - Telemetry
      - MQTT
    properties:
      - type: APIReference
        url: https://www.gevernova.com/software/documentation/opshub/version2025/windows/r_rest_integration_apis.html
      - type: Documentation
        url: https://www.gevernova.com/software/documentation/opshub/version2025/index.html
      - type: EventTypes
        url: https://www.gevernova.com/software/documentation/opshub/version2025/windows/r_mqtt_apis.html
  - aid: ge-vernova-apm-data-extraction-odata-api
    name: APM Data Extraction OData API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ge-vernova.png
    description: >-
      An OData service hosted as part of the APM Web API, exposing APM families — assets, alerts,
      cases, work orders — as entity collections for extraction into external reporting and
      analytics tools. Supports $metadata, $count, $select, $filter, $top, $orderby, $expand and
      $skip, server-driven pagination, and the standard OData string, math and date functions.
      Requires a Meridium Core (Foundation) licence and a Predix UAA account; SSO credentials are
      explicitly not accepted.
    humanURL: https://www.gevernova.com/software/documentation/cloud-apm/latest/ade-supported-features.html
    baseURL: https://{apm-host}/meridium/api/odata
    tags:
