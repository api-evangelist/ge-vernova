  - aid: ge-vernova-proficy-plant-applications-rest-api
    name: Proficy Plant Applications REST API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ge-vernova.png
    description: >-
      The MES surface of Proficy Plant Applications, delivered as 37 documented microservices on
      port 5059 of the Web Client host — activities, work orders, process orders, routes, downtime,
      OEE and production metrics, non-conformance, e-signature, labor, waste, document management
      and ERP import/export among them. Each service publishes its own Swagger UI on the
      installation. ERP integration accepts and emits B2MML (ANSI-ISA-95) documents alongside JSON.
    humanURL: https://www.gevernova.com/software/documentation/proficy-plant-applications/version2025/pa_rest_api/c_rest_api_pa_introduction.html
    baseURL: https://{plant-applications-web-client-host}:5059
    tags:
      - Manufacturing Execution Systems
      - Industrial
      - Work Orders
      - ISA-95
    properties:
      - type: APIReference
        url: https://www.gevernova.com/software/documentation/proficy-plant-applications/version2025/pa_rest_api/c_pa_rest_api_endpoints_documentation.html
      - type: Console
