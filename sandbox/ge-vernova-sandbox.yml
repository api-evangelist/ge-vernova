note: >-
  GE Vernova does not run a hosted API sandbox with test credentials. What it publishes instead is
  (a) free downloadable trials of four on-premises Proficy products, which is how a developer gets a
  working instance of the REST APIs, and (b) interactive product demos. The Swagger UI shipped with
  each installed product is the try-it console. No test card numbers, magic identifiers, test-mode
  key prefixes or time-simulation tooling exist for this portfolio; none were invented here.
