http_status_contract:
  source: https://www.gevernova.com/software/documentation/historian/version2025/c_api_status_messages.html
  statuses:
    - {status: 200, title: OK, meaning: Success. The request has completed.}
    - {status: 201, title: Created, meaning: A new resource has been created; the resource URI is in the Location header.}
    - {status: 204, title: No Content, meaning: An update to an existing resource has been applied.}
    - {status: 400, title: Bad Request, meaning: The request was malformed; the response body provides additional information.}
    - {status: 401, title: Unauthorized, meaning: Not authenticated, or the authentication is incorrect. Re-authenticate and try again.}
    - {status: 403, title: Forbidden, meaning: You do not have permission to access this resource.}
    - {status: 404, title: Not Found, meaning: The requested resource does not exist.}
    - {status: 500, title: Internal Error, meaning: The server encountered an unexpected condition.}
