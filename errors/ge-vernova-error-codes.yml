format: vendor-error-registry
note: >-
  GE Vernova does not publish RFC 9457 problem+json for any Electrification Software product. What
  it does publish is (a) an HTTP status-code contract that is identical across Historian and Plant
  Applications, and (b) a numeric ErrorCode registry returned in Historian REST/SDK responses. Both
  are transcribed verbatim from the product documentation. There is no OpenAPI to derive 4xx/5xx
  response shapes from.
